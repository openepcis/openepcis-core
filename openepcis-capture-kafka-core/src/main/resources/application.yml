kafka:
  bootstrap:
    servers: openepcis-kafka:9092
  topics:
    epcis-event-captured: epcis-event-captured
    capture-docs-event: capture-document-event
    capture-doc-event-count: capture-document-event-count
    capture-docs: capture-documents
    event-validated: epcis-event-validated
    event-persisted: epcis-event-persisted
    capture-docs-agg: capture-documents-agg
    streaming-subscription: streaming-subscription
  stores:
    capture-docs-store: capture-documents-store
    global-capture-job-message-store: global-capture-job-message-store

quarkus:
  kafka-streams:
    bootstrap-servers: ${kafka.bootstrap.servers}
    topics: ${kafka.topics.epcis-event-captured}
    application-id: openepcis-capture-kafka-streams
